name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moved to 26.04, where setup-python no longer ships 3.9,
        # so the minimum supported version is pinned to ubuntu-22.04.
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        include:
          # Always also run the newest Ubuntu + a current interpreter.
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test
        run: python selftest.py
